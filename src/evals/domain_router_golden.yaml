# Domain router eval: real model, no warehouse. Run with `python -m evals.run_domain_eval`.
#
# Truth follows the rules in agent/prompts/domain_router.py.
# - domains: the primary packs, lead first. The set must match; the lead must be first.
# - accept_lead: other leads that are also correct (the set then only has to contain one).
# - joins: expected join packs. Omitted when a place is arguable (a project, a road).
# - recipe: the recipe id, or null.
# - turn_kind and last_need_db describe a follow-up.

