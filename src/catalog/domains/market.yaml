id: market
name: Price indices and construction statistics
schema: chatbot_ai
description: Official DSC price indices, rent indices, construction-cost series, building-stock aggregates,
  community average sale and rent prices, and community rental yields. Use for market movement and yield
  or ROI by area, not individual deals.
synonyms:
- price index
- rent index
- rental yield
- rental return
- ROI
- construction cost
- market trend
- inflation
- stock of buildings
grain: one row is a period (month/quarter/year) for a statistical series
joins: []
pitfalls:
- These tables are wide/messy DSC extracts (value + type + year). They are not deal-level.
- City-wide DSC indices are not a community price. For a community average, use public.dld_community_avg_sale_price.
- avg_price_type is sale or rent. Filter it before comparing communities.
- price_trend_buy_fact and price_trend_rent_fact are deal-level facts for trends. Aggregate them; do not list every row.
- Ignore leftover column_* fields; they are extract artifacts.
- For rental yield or ROI by community, use the yield columns of mv_community_dld_market_metrics or
  mv_community_landing_page_stats. They match rent and price on the same basis; do not divide one average by another.
- Every yield here is gross. No table holds a net yield (after service charges and costs); for a net yield,
  return the gross figure and say in purpose that it is gross.
- The community metrics are one row per community for all property types together; they do not split by
  apartment, villa, or bedroom count.
- Qualify public tables as public.<table>.
