id: listings
name: Properties, units, and buildings
schema: chatbot_ai
description: DLD-registered plots, freehold units, and buildings. Use this for what exists in an area
  (type, size, freehold, building status). This is inventory, not classified asking prices.
synonyms:
- listings
- units
- apartments
- villas
- buildings
- freehold
- title deed
- plot
- land registry
grain: one row is a property unit, plot, or building
joins:
- domain: locations
  keys:
  - area_id
  - area_name_en
  - community_name_english
  - community_id
- domain: developers
  keys:
  - project_id
  - project_name_en
  - master_project_en
pitfalls:
- There are no Bayut/Property Finder asking-price listing tables here.
- Use transactions for sold prices and rent_contracts for contracted rents.
- building_property_records and registered_freehold_real_estate_units overlap; prefer freehold units for
  apartments.
tables:
- name: building_property_records
  description: Dubai Land Department building and property project records
  primary_key:
  - property_id
  columns:
  - name: land_type_en
    type: character varying(50)
    meaning: Land type in English (e.g. Residential, Commercial)
    examples:
    - Residential
    - Government Authorities
  - name: land_type_ar
    type: character varying(50)
    meaning: Land type in Arabic
  - name: land_type_id
    type: numeric(32,0)
    meaning: Land type identifier
    examples:
    - 1
    - 6
  - name: project_name_en
