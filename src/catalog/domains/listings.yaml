# Columns whose values are names users type. Grounding loads their stored spellings,
# so the SQL model filters on the exact value. same_place_as names a column on the same
# row that holds the official name of the same place; that pairing is learned from the data.
named_values:
- table: public.properties
  column: developer
  kind: developer
- table: chatbot_ai.building_property_records
  column: area_name_en
  kind: area
- table: chatbot_ai.building_property_records
  column: master_project_en
  kind: master_project
  same_place_as: area_name_en
- table: chatbot_ai.building_property_records
  column: project_name_en
  kind: project
- table: chatbot_ai.land_registry
  column: area_name_en
  kind: area
- table: chatbot_ai.land_registry
  column: master_project_en
  kind: master_project
  same_place_as: area_name_en
