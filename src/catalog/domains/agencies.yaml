id: agencies
name: Brokers, agencies, and valuators
schema: chatbot_ai
description: Licensed real-estate offices, brokers, permits, valuators, and owners associations. Use for
  who can sell or manage a building.
synonyms:
- broker
- agency
- agent
- valuator
- owners association
- RERA license
grain: one row is a broker, office license, permit, or OA company
joins:
- domain: developers
  keys:
  - license_number
  - participant_id
pitfalls:
- real_estate_offices is the company; real_estate_brokers are people licensed under an office.
- Do not treat these as property listings.
- 'Not in this pack: who builds a project or its handover (developers); service charges (regulations);
  sale or rent listings (listings); registered sales and rents (transactions).'
tables:
- name: real_estate_offices
  description: Real estate offices and their activities from Dubai Land Department
  primary_key:
  - real_estate_id
  - activity_type_id
  columns:
  - name: activity_type_en
    type: character varying(100)
    meaning: Activity type in English
    examples:
    - Real Estate Buying & Selling Brokerage
    - Leasing Property Brokerage Agents
  - name: participant_id
    type: numeric(10,0)
    meaning: Participant identifier
    examples:
    - 372527
    - 372528
  - name: real_estate_id
    type: numeric(10,0)
    meaning: Real estate identifier
    examples:
    - 1
    - 2
  - name: real_estate_number
    type: numeric(20,0)
    meaning: Real estate number
    examples:
    - 105
    - 106
  - name: license_source_id
    type: numeric(10,0)
    meaning: License source identifier
    examples:
    - -10
    - 73965376
  - name: license_source_ar
    type: character varying(200)
    meaning: License source in Arabic
  - name: license_source_en
    type: character varying(200)
    meaning: License source in English
    examples:
    - DUBAI ECONOMIC DEPARTMENT
    - TRAKHEEES-DED
  - name: license_number
    type: character varying(50)
    meaning: License number
    examples:
    - '543814'
    - '579556'
  - name: license_issue_date
    type: date
    meaning: License issue date
    examples:
    - YYYY-MM-DD
  - name: license_expiry_date
    type: date
    meaning: License expiry date
    examples:
    - YYYY-MM-DD
  - name: is_branch
    type: numeric(20,0)
    meaning: Is branch
    examples:
    - 0
  - name: main_office_id
    type: numeric(10,0)
    meaning: Main office identifier
  - name: webpage
    type: character varying(200)
    meaning: Webpage
    examples:
    - https://example.ae
  - name: phone
    type: character varying(100)
    meaning: Phone
    examples:
    - +971XXXXXXXXX
  - name: fax
    type: character varying(30)
    meaning: Fax
    examples:
    - +971XXXXXXXXX
  - name: activity_type_id
    type: numeric(4,0)
    meaning: Activity type identifier
    examples:
