id: developers
name: Developers, projects, and construction
schema: chatbot_ai
description: Off-plan and master projects, consultants, contractors, building permits, and MRHE housing
  projects. Use for handover, completion, and who is building what.
synonyms:
- developer
- project
- off-plan
- handover
- completion
- permit
- contractor
- consultant
- escrow
grain: one row is a project, permit, or project-building link
joins:
- domain: listings
  keys:
  - project_id
  - project_no
  - parcel_id
  - building_id
- domain: locations
  keys:
  - community_name
  - parcel_id
pitfalls:
- real_estate_projects is the DLD project register; projects_information is municipality permit workflow.
- percent_completed is a project-level figure, not a unit handover date.
- public.developers is a developer profile (sold, delivered, HQ). It is not the DLD license register.
- public.offplan_projects_new is the current off-plan project card, including starting price and amenity JSON.
- Qualify public tables as public.<table>.
