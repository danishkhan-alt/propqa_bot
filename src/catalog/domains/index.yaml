schema: chatbot_ai
note: Router should load this index only. Load a domain YAML after routing. Open-data noise (courts, visas,
  flights, chats, ridership) is omitted.
domains:
- id: listings
  file: listings.yaml
  name: Properties, units, and buildings
  description: Live asking-price listings in public.properties, plus DLD plots, freehold units, and buildings.
    Use this for beds, price, and what is for sale or rent.
  not_for: Sold prices, sale volumes, and registered rents (transactions). Community average prices, rents,
    and yields (market).
  synonyms:
  - listings
  - units
  - apartments
  - villas
  - buildings
  - freehold
  - title deed
  - plot
  - land registry
  - for sale
  - for rent
  - asking price
  table_count: 18
- id: transactions
  file: transactions.yaml
  name: Sales, rents, and valuations
  description: DLD sales, Ejari-style rent contracts, official valuations, and the residential sale index.
    Use for transacted prices, volumes, and rents.
  not_for: What is on the market now (listings). Rents in a community or how rents moved, since its rent
    contracts end in 2021 (market). Rental yield or ROI (market). City-wide market direction or a price
    index (market).
  synonyms:
  - sales
  - sold
  - transactions
  - deals
  - transacted price
  - rent
  - ejari
  - tenancy
  - valuation
  - average price
  table_count: 7
- id: locations
  file: locations.yaml
  name: Communities, areas, and geo hierarchy
  description: Dubai communities, subcommunities, the public location tree, community facility JSON, Makani
    entrances, and population. This is the usual join bridge for other domains.
  not_for: Being the place another subject is filtered on. Only when the user asks where something is, which
    community it belongs to, or facts about the area itself such as population.
  synonyms:
  - community
  - area
  - neighbourhood
  - location
  - subcommunity
  - makani
  - sector
  - where is
  table_count: 15
- id: developers
  file: developers.yaml
  name: Developers, projects, and construction
  description: Off-plan and master projects, developer profiles, consultants, contractors, building permits,
    and MRHE housing projects. Use for handover, completion, and who is building what.
  not_for: Service charges (regulations). Brokers and owners associations (agencies).
  synonyms:
  - developer
  - project
  - off-plan
  - handover
  - completion
  - permit
  - contractor
  - consultant
  - escrow
  table_count: 16
- id: schools
  file: schools.yaml
  name: Schools, nurseries, and universities
  description: KHDA private schools, ratings, fees, nearby schools per community, early-childhood centres,
    and universities. Use for education near a property.
  not_for: Parks, beaches, and hospitals (amenities). Metro and commute (rta).
  synonyms:
  - school
  - KHDA
  - nursery
  - university
  - curriculum
  - school fees
  - inspection rating
  table_count: 13
- id: rta
  file: rta.yaml
  name: Transport, parking, and roads
  description: Metro, tram, bus, marine stations, parking, Salik gates, cycle tracks, and major roads.
    Use for commute and parking around a community.
  not_for: Schools (schools). Parks, beaches, and hospitals (amenities).
  synonyms:
  - metro
  - tram
  - bus
  - RTA
  - parking
  - salik
  - toll
  - commute
  - station
  table_count: 33
- id: amenities
  file: amenities.yaml
  name: Parks, healthcare, and lifestyle
  description: Parks, healthcare, things-to-do, and named building or project amenities such as pool and
    gym. Use for lifestyle and facilities, not school or metro lookups.
  not_for: Schools and nurseries (schools). Metro, parking, and roads (rta).
  synonyms:
  - park
  - beach
  - hospital
  - clinic
  - amenities
  - things to do
  - healthcare
  - pool
  table_count: 6
- id: agencies
  file: agencies.yaml
  name: Brokers, agencies, and valuators
  description: Licensed real-estate offices, brokers, permits, valuators, and owners associations. Use
    for who can sell or manage a building.
  not_for: Who builds a project (developers). Service charges (regulations).
  synonyms:
  - broker
  - agency
  - agent
  - valuator
  - owners association
  - RERA license
  table_count: 6
- id: regulations
  file: regulations.yaml
  name: Service charges and property procedures
  description: Owners-association service charges by community/project and DLD property-map request procedures.
  not_for: Owners association contacts (agencies). Handover and who is building (developers).
  synonyms:
  - service charge
  - maintenance fee
  - OA fees
  - DLD procedure
  - site plan
  table_count: 2
- id: market
  file: market.yaml
  name: Price indices and construction statistics
  description: Official DSC price indices, construction-cost series, community average sale and rent
    prices, and community rental yields. Use for market movement and yield or ROI by area, not a single deal.
  not_for: A single deal, sale volumes, or an average sale price over a named period (transactions). What
    is on the market now (listings).
  synonyms:
  - price index
  - rent index
  - rental yield
  - rental return
  - ROI
  - construction cost
  - market trend
  - inflation
  - stock of buildings
  table_count: 28
