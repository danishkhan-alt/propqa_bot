schema: chatbot_ai
note: Router should load this index only. Load a domain YAML after routing. Open-data noise (courts, visas,
  flights, chats, ridership) is omitted.
domains:
- id: listings
  file: listings.yaml
  name: Properties, units, and buildings
  description: Live asking-price listings in public.properties, with their amenities, views, and
    nearby places, plus DLD plots, freehold units, and buildings. Use this for beds,
    price, what is for sale or rent (including a 2-bed rent near a metro), and for a
    named building's profile (price per sqft, rent, yield, service charge, units) or a
    comparison of buildings.
  not_for: Sold prices, sale volumes, and registered rents (transactions). Community average prices,
    rents, and yields (market). Where a station or stop is (rta).
  synonyms:
  - listings
  - units
  - apartments
  - villas
  - buildings
  - freehold
  - title deed
  - plot
  - land registry
  - for sale
  - for rent
  - asking price
  table_count: 25
- id: transactions
  file: transactions.yaml
  name: Sales, rents, and valuations
  description: DLD registered sales and rent contracts (public.real_estate_dld_*) with their areas,
    projects, developers, buildings, units, and land registry, plus official valuations
    and the residential sale index. Use for transacted prices, volumes, registered rents
    in an area and period, and who sold the most.
  not_for: What is on the market now (listings). Community average rent or yield, how rents moved,
    or a price index (market). What an area is like (locations). Off-plan brochures, starting
    prices, and handover (developers).
  synonyms:
  - sales
  - sold
  - transactions
  - deals
  - transacted price
  - rent
  - ejari
  - tenancy
  - valuation
  - average price
  table_count: 10
- id: locations
  file: locations.yaml
  name: Communities, areas, and geo hierarchy
  description: Dubai communities, subcommunities, the public location tree, community overviews and
    landing metrics, places, points of interest, roads, Makani entrances, and population.
    This is the usual join bridge for other domains. Use for what an area is like
    together with market.
  not_for: Being the place another subject is filtered on. Only when the user asks where something
    is, which community it belongs to, or facts about the area itself such as population.
    Registered sales or rents in an area (transactions).
  synonyms:
  - community
  - area
  - neighbourhood
  - location
  - subcommunity
  - makani
  - sector
  - where is
  table_count: 23
- id: developers
  file: developers.yaml
  name: Developers, projects, and construction
  description: Off-plan projects and their brochures, master and DLD-registered projects, developer
    profiles, consultants, contractors, building permits, and MRHE housing projects. Use
    for handover, completion, starting price, payment plans, and who is building what.
  not_for: Service charges (regulations). Brokers and owners associations (agencies). Registered
    sale volumes by developer (transactions). Units for sale in a project (listings).
    Distance to a metro station (rta).
  synonyms:
  - developer
  - project
  - off-plan
  - handover
  - completion
  - permit
  - contractor
  - consultant
  - escrow
  table_count: 17
- id: schools
  file: schools.yaml
  name: Schools, nurseries, and universities
  description: KHDA private schools, ratings, fees, nearby schools per community, early-childhood centres,
    and universities. Use for education near a property.
  not_for: Parks, beaches, and hospitals (amenities). Metro and commute (rta). Properties for sale
    or rent near a school (listings).
  synonyms:
  - school
  - KHDA
  - nursery
  - university
  - curriculum
  - school fees
  - inspection rating
  table_count: 13
- id: rta
  file: rta.yaml
  name: Transport, parking, and roads
  description: Metro, tram, bus, marine stations, parking tariffs and spaces, Salik gates, cycle
    tracks, and major roads. Use for commute and parking around a community. Ridership
    and fleet data are not loaded.
  not_for: Schools (schools). Parks, beaches, and hospitals (amenities). Properties for sale or rent
    near a station (listings).
  synonyms:
  - metro
  - tram
  - bus
  - RTA
  - parking
  - salik
  - toll
  - commute
  - station
  table_count: 32
- id: amenities
  file: amenities.yaml
  name: Parks, healthcare, and lifestyle
  description: Parks, healthcare, things-to-do, and named building or project amenities such as pool and
    gym. Use for lifestyle and facilities, not school or metro lookups.
  not_for: Schools and nurseries (schools). Metro, parking, and roads (rta). Listings that have a
    pool or gym (listings).
  synonyms:
  - park
  - beach
  - hospital
  - clinic
  - amenities
  - things to do
  - healthcare
  - pool
  table_count: 5
- id: agencies
  file: agencies.yaml
  name: Brokers, agencies, and valuators
  description: Licensed real-estate offices, brokers, permits, valuators, and owners associations. Use
    for who can sell or manage a building.
  not_for: Who builds a project (developers). Service charges (regulations). Property listings
    (listings).
  synonyms:
  - broker
  - agency
  - agent
  - valuator
  - owners association
  - RERA license
  table_count: 6
- id: regulations
  file: regulations.yaml
  name: Service charges and property procedures
  description: Owners-association service charges by community/project and DLD property-map request procedures.
  not_for: Owners association contacts (agencies). Handover and who is building (developers).
    Registered sales and rents (transactions).
  synonyms:
  - service charge
  - maintenance fee
  - OA fees
  - DLD procedure
  - site plan
  table_count: 2
- id: market
  file: market.yaml
  name: Price indices and construction statistics
  description: Official DSC price indices, construction-cost series, community average sale and rent
    prices, registered-rent summaries, and community rental yields. Use for market
    movement and yield or ROI by area, not a single deal.
  not_for: A single deal, sale volumes, or an average sale price over a named period (transactions).
    Registered rents in a named area and period (transactions). What is on the market now
    (listings).
  synonyms:
  - price index
  - rent index
  - rental yield
  - rental return
  - ROI
  - construction cost
  - market trend
  - inflation
  - stock of buildings
  table_count: 29
