id: regulations
name: Service charges and property procedures
schema: chatbot_ai
description: Owners-association service charges by community/project and DLD property-map request procedures.
synonyms:
- service charge
- maintenance fee
- OA fees
- DLD procedure
- site plan
grain: one row is a service-charge budget line or a map-request procedure
joins:
- domain: developers
  keys:
  - project_id
  - master_community_id
- domain: locations
  keys:
  - master_community_name_en
pitfalls:
- service_cost is the published OA budget figure, not a DLD transfer fee.
- DLD buyer/seller transfer percentages are not stored as a simple fee table here.
- 'Not in this pack: who builds a project or its handover (developers); owners association contacts and
  brokers (agencies); registered sales and rents (transactions); asking-price listings (listings).'
tables:
- name: owners_association_service_charges
  description: DLD owners association service charges
  primary_key:
  - master_community_id
  - property_group_id
  - project_id
  - usage_id
  - budget_year
  - service_category_id
  columns:
  - name: master_community_id
    type: numeric(15,0)
    meaning: Master community identifier
    examples:
    - 112
    - 519
  - name: property_group_id
    type: numeric(15,0)
    meaning: Property group identifier
    examples:
    - 548592493
    - 427215
  - name: project_id
    type: numeric(15,0)
    meaning: Project identifier
    examples:
    - 157081732
    - 317
  - name: usage_id
    type: numeric(15,0)
    meaning: Usage identifier
    examples:
    - 1
    - 4
  - name: budget_year
    type: numeric(4,0)
    meaning: Service-charge budget year
    examples:
    - YYYY
  - name: service_category_id
    type: numeric(15,0)
    meaning: Service category identifier
    examples:
    - 12
    - 7
  - name: master_community_name_en
    type: character varying(200)
    meaning: Master community name in English
    examples:
    - Business Bay
    - Dubai Silicon Oasis
  - name: master_community_name_ar
    type: character varying(200)
    meaning: Master community name in Arabic
  - name: property_group_name_en
    type: character varying(200)
    meaning: Property group name in English
    examples:
    - Reva Residences
    - Silicon Heights
  - name: property_group_name_ar
    type: character varying(200)
    meaning: Property group name in Arabic
  - name: project_name
    type: character varying(200)
    meaning: Project name
    examples:
    - REVA RESIDENCES
    - SILICON HEIGHTS
  - name: usage_name_en
    type: character varying(200)
    meaning: Usage name in English
    examples:
    - Residential
    - Retail
  - name: usage_name_ar
    type: character varying(200)
    meaning: Usage name in Arabic
  - name: service_cost
    type: numeric(10,2)
    meaning: Owners-association service charge amount
    examples:
    - 2
    - 0
  - name: service_category_name_en
    type: character varying(200)
    meaning: Service category name in English
    examples:
    - Reserved Fund
    - Insurance
  - name: service_category_name_ar
    type: character varying(200)
    meaning: Service category name in Arabic
  - name: management_company_id
    type: numeric(15,0)
    meaning: Management company identifier
    examples:
    - 208550
    - 147154
  - name: management_company_name_en
    type: character varying(200)
    meaning: Management company name in English
    examples:
    - LUXURY OWNER ASSOCIATION MANAGEMENT SERVICES CO. L.L.C
    - RELIANCE OWNERS ASSOCIATION MANAGEMENT SERVICES
  - name: management_company_name_ar
    type: character varying(200)
    meaning: Management company name in Arabic
  qualified_name: chatbot_ai.owners_association_service_charges
- name: property_map_requests
  description: Dubai Land Department property map requests
  primary_key:
  - request_id
  columns:
  - name: no_of_siteplans
    type: numeric(20,0)
    meaning: No of siteplans
    examples:
    - 1
  - name: property_type_en
    type: character varying(200)
    meaning: Property type in English (Unit, Villa, Land, Building)
    examples:
    - Land
    - Unit
  - name: property_type_ar
    type: character varying(200)
    meaning: Property type in Arabic
  - name: property_type_id
    type: numeric(20,0)
    meaning: Property type identifier
    examples:
    - 1
    - 3
  - name: procedure_name_en
    type: character varying(200)
    meaning: DLD procedure name in English (Sale, Mortgage, ...)
    examples:
    - Sale
    - Bestowal
  - name: procedure_name_ar
    type: character varying(200)
    meaning: Procedure name in Arabic
  - name: procedure_id
    type: numeric(20,0)
    meaning: Procedure identifier
    examples:
    - 11
    - 1
  - name: request_source_en
    type: character varying(200)
    meaning: Request source in English
    examples:
    - Dubai Land Department
  - name: request_source_ar
    type: character varying(200)
    meaning: Request source in Arabic
  - name: request_source_id
    type: numeric(20,0)
    meaning: Request source identifier
    examples:
    - 1
  - name: application_name_en
    type: character varying(200)
    meaning: Application name in English
    examples:
    - TABU
  - name: application_name_ar
    type: character varying(200)
    meaning: Application name in Arabic
  - name: application_id
    type: numeric(20,0)
    meaning: Application identifier
    examples:
    - 4
  - name: request_date
    type: date
    meaning: Request date
    examples:
    - YYYY-MM-DD
  - name: request_id
    type: character varying(200)
    meaning: Request identifier
    examples:
    - 1-2003
    - 1-2004
  qualified_name: chatbot_ai.property_map_requests

# Columns whose values are names users type. Grounding loads their stored spellings,
# so the SQL model filters on the exact value. same_place_as names a column on the same
# row that holds the official name of the same place; that pairing is learned from the data.
named_values:
- table: chatbot_ai.owners_association_service_charges
  column: master_community_name_en
  kind: area
- table: chatbot_ai.owners_association_service_charges
  column: project_name
  kind: project
