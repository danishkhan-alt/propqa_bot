id: rta
name: Transport, parking, and roads
schema: chatbot_ai
description: Metro, tram, bus, marine stations, parking, Salik gates, cycle tracks, and major roads. Use
  for commute and parking around a community.
synonyms:
- metro
- tram
- bus
- RTA
- parking
- salik
- toll
- commute
- station
grain: one row is a station, stop, parking zone, road, or fare row
joins:
- domain: locations
  keys:
  - community_name
  - community_num
  - area_en
  - latitude
  - longitude
- domain: listings
  keys:
  - nearest_metro_en
pitfalls:
- Prefer *_gis / station tables for locations. Ridership and fleet tables are excluded.
- The nearest station or stop to a place is found by distance. Take the place's latitude and longitude
  (public.locations or public.locations_v2 for an area or building) and order stations by
  ST_DistanceSphere to it. A station's name says nothing about where the place is; never find the nearest
  one by matching the place name against station names.
- Parking zone names and community numbers may not match DLD area names exactly.
- 'Cue to table: metro stations or lines -> metro_stations / metro_stations_gis; tram -> tram_stations,
  tram_stations_gis; bus routes at a named stop -> bus_stops_gis joined to public_transportation_routes_stops;
  bus coverage of a community -> bus_network_coverage; parking tariff -> parking_rates; parking spaces
  in a community -> bus_network_coverage joined to number_of_parking_spaces_per_zone; ferry, abra, water
  bus -> marine_stations or marine_stations_gis; Salik tariff -> salik_tariff, gate locations -> salik_tolling_gates_location.'
- 'Bus join: bus_stops_gis.bus_stop_id (6-digit text) = public_transportation_routes_stops.stop_id. Never
  use bus_stop_details.stop_id for this join; it is a different numbering. bus_routes has no stop id and
  joins by name or stop_number only.'
- "Parking tariff: parking_rates.zone is a tariff band such as 'A', 'B', 'C', 'D', or 'Multi-Storey Parking', not an area name or community number. A community's parking spaces come from bus_network_coverage JOIN number_of_parking_spaces_per_zone ON community_num. A user's zone letter for a tariff question filters parking_rates.zone only. Only about a third of bus_network_coverage communities have a parking-spaces row; when the join finds none, say the parking-space count is not published for that community."
- 'Marine join: marine_stations and marine_stations_gis join on station_id only (cast both sides to text).
  marine_lines has no station id, so link it to stations by route_name or station names.'
- 'Time: parking_rates and salik_tariff store year (integer) and month as a 3-letter name (''Jan'', ''Feb'');
  there is no date column. The latest tariff is the highest year and then the latest month; month is text, so order it with EXTRACT(MONTH FROM TO_DATE(month, ''Mon'')), never alphabetically.'
- No ridership, passenger-trip, fleet, or taxi-trip tables are loaded in the warehouse; for 'metro ridership
  in March' say the data is not available here and offer stations, lines, parking, or tariffs instead.
  Never answer ridership from station or line rows.
- "Display names: metro_stations.location_name_english stores 'DAMAC Properties Metro Station' and 'Nakheel Metro Station'; show them as 'Sobha Realty Metro Station' and 'Al Fardan Exchange Metro Station'. metro_stations_gis.station_name_en already stores 'SOBHA REALTY' and 'Al Fardan Exchange'. Filter on the stored name, show the display name."
- 'Not in this pack: properties for rent or sale near a station, such as ''2-bed rent near metro'' (listings;
  use public.properties with its nearby_locations and nearest_metro fields); what a community is like
  (locations); schools, hospitals, malls (amenities).'
