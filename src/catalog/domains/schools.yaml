id: schools
name: Schools, nurseries, and universities
schema: chatbot_ai
description: KHDA private schools, ratings, fees, nearby schools per community, early-childhood centres,
  and universities. Use for education near a property.
synonyms:
- school
- KHDA
- nursery
- university
- curriculum
- school fees
- inspection rating
grain: one row is a school, fee row, or community-school distance
joins:
- domain: locations
  keys:
  - community_id
  - areaen
  - area_en
  - location
  - lat
  - long
pitfalls:
- KHDA ratings and fee tables use different school-name spellings; join on educationcenterid when possible.
- private_schools has historical DSIB ratings by year; khda_school_search has the latest overall rating.
- ps_schools distances are relative to a Property Share community, not a lat/long radius query.
tables:
- name: khda_dubai_private_schools
  description: Private schools operating in Dubai (KHDA)
  primary_key:
  - name_eng
  columns:
  - name: name_eng
    type: character varying(300)
    meaning: Name eng
    examples:
    - Jumeira Baccalaureate School
    - Dubai Schools Corporation Al Khawaneej L.L.C
  - name: educationcenterid
    type: character varying(20)
    meaning: Educationcenterid
    examples:
    - '509'
    - '502020'
  - name: curriculumen
    type: character varying(100)
    meaning: School curriculum in English
    examples:
    - IB
    - US
  - name: grades_years
    type: character varying(100)
    meaning: Grades years
    examples:
    - Pre primary to Grade 12
    - KG 1 to Grade 8
  - name: students
    type: numeric(10,0)
    meaning: Students
    examples:
    - 1614
    - 1300
  - name: school_rating
    type: character varying(200)
    meaning: KHDA / DSIB inspection rating
    examples:
    - Very good
    - Acceptable
  - name: location
    type: character varying(100)
    meaning: Location
