- name: real_estate_dld_areas
  description: DLD area dimension (about 300 areas). Join facts on area_id; name_en is the English area
    name.
  primary_key:
  - area_id
  columns:
  - name: area_id
    type: bigint
    meaning: DLD area identifier; transactions, rent contracts, projects, buildings and units carry it
  - name: name_en
    type: character varying(255)
    meaning: Area name in English (DLD spelling, for example Marsa Dubai)
  - name: municipality_number
    type: bigint
    meaning: Dubai Municipality area number
  qualified_name: public.real_estate_dld_areas
