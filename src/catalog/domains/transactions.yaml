    meaning: Project / building name in English
    examples:
    - DUBAI MARINA MALL
    - PARK ISLANDS
  - name: project_name_ar
    type: character varying(200)
    meaning: Project / building name in Arabic
  - name: project_number
    type: numeric(30,0)
    meaning: Project number
    examples:
    - 1460
    - 1458
  - name: building_name_en
    type: character varying(200)
    meaning: Building name in English
    examples:
    - Dubai Marina Mall Hotel
    - PARK ISLAND BLAKELY
