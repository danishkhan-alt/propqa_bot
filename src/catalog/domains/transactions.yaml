    examples:
    - Burj Al Arab
    - Sports City Swimming Academy
  - name: nearest_landmark_ar
    type: character varying(200)
    meaning: Nearest landmark in Arabic
  - name: master_project_ar
    type: character varying(200)
    meaning: Master community / master development in Arabic
  - name: master_project_en
    type: character varying(200)
    meaning: Master community / master development in English
