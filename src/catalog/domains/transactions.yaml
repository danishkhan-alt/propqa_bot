id: transactions
name: Sales, rents, and valuations
schema: chatbot_ai
description: DLD registered sales and other procedures (real_estate_dld_transactions), Ejari rent contracts
  (real_estate_dld_rent_contracts), the DLD area, project, developer, building, unit and land registers,
  official valuations, and the residential sale index. Use for transacted prices, volumes, and registered
  rents.
synonyms:
- sales
- sold
- transactions
- deals
- transacted price
- rent
- ejari
- tenancy
- valuation
- average price
grain: one row is a DLD procedure, a rent-contract line, a registered project, developer, building, unit or parcel, a valuation, or a monthly index point
joins:
- domain: locations
  keys:
  - area_id
  - area_name_en
  - area_name_ar
- domain: developers
  keys:
  - project_name_en
  - master_project_en
  - project_id
- domain: listings
  keys:
  - property_id
pitfalls:
- actual_worth is the registered transacted price, not an asking price.
- real_estate_dld_rent_contracts are registered tenancies, not listing rents.
- A rent contract made, registered, or running from a period is dated by contract_start_date. contract_end_date
  is when the lease ends; use it only when the user asks about leases ending or expiring. Rent contracts in a
  recent period, such as this month, are filtered on contract_start_date even when that finds none.
- real_estate_dld_transactions mixes procedures: trans_group_en is Sales, Mortgages or Gifts. Filter trans_group_en = 'Sales' for sales; use procedure_name_en for finer procedures.
- meter_sale_price is AED per sqm; do not mix with actual_worth totals.
- A rent contract's annual_amount can cover several units (no_of_prop). Do not divide an average rent by an
  average sale price for a yield; the market domain holds community yields computed on a matched basis.
- 'Time columns: sales and procedures use instance_date; rent contracts use contract_start_date with contract_start_date
  <= CURRENT_DATE (a few contracts start in the future). Value columns: actual_worth for sales, annual_amount
  for rents. Never put a sale-only column (actual_worth, meter_sale_price, trans_group_en) on real_estate_dld_rent_contracts,
  and never read annual_amount from real_estate_dld_transactions.'
- 'Joins: real_estate_dld_transactions and real_estate_dld_rent_contracts join real_estate_dld_areas ON
  area_id (area name_en). real_estate_dld_projects joins real_estate_dld_developers ON developer_id. real_estate_dld_buildings
  and real_estate_dld_units join real_estate_dld_projects ON project_id. real_estate_dld_transactions
  joins real_estate_dld_projects ON project_number. A named place can also be filtered directly on area_name_en,
  master_project_en, or project_name_en in the fact tables.'
- 'Yield or ROI is not computed here. Do not divide an average rent by an average sale price: community
  yields are in the market pack.'
- Never join these DLD tables to public.properties (listings pack) or to the off-plan catalog (developers
  pack). A registered fact and an asking price or marketing record are different worlds; answer each from
  its own pack.
- 'Not in this pack: what is for sale now (listings); community average prices, price indices, trends,
  and yields (market); the off-plan project catalog, brochures, and payment plans (developers); what an
  area is like (locations).'
- 'Place filter: a community is either a DLD area (area_name_en, for example ''Burj Khalifa'') or a master
  project (master_project_en, for example ''DownTown Dubai''). They overlap but count different rows.
  Filter on one of them, never OR them together; when both are plausible say which one the figure uses.'
tables:
- name: real_estate_dld_transactions
  description: >-
    DLD registered transactions, one row per procedure (sales, mortgages, gifts). Date column: instance_date.
    Value column: actual_worth (AED). Sales are trans_group_en = 'Sales'. Join real_estate_dld_areas on area_id
    for the area; projects by project_number = real_estate_dld_projects.project_number.
  segments: [property_sub_type_en, property_type_en, rooms_en]
  basis: [trans_group_en]
  primary_key:
  - transaction_id
  columns:
  - name: no_of_parties_role_3
    type: numeric(3,0)
    meaning: No of parties role 3
    examples:
    - 0
  - name: no_of_parties_role_2
    type: numeric(3,0)
    meaning: No of parties role 2
    examples:
    - 1
  - name: no_of_parties_role_1
    type: numeric(3,0)
    meaning: No of parties role 1
    examples:
    - 1
  - name: meter_rent_price
    type: numeric(30,6)
    meaning: Rent per square metre in AED
  - name: rent_value
    type: numeric(30,6)
    meaning: Contract rent amount in AED
  - name: meter_sale_price
    type: numeric(30,6)
    meaning: Sale price per square metre in AED
    examples:
    - 31465.1
    - 10540.37
  - name: actual_worth
    type: numeric(30,6)
    meaning: Transacted sale value in AED
    examples:
    - 1601888
    - 902888
  - name: procedure_area
    type: numeric(30,6)
    meaning: Area recorded on the transaction in square metres
    examples:
    - 50.91
    - 85.66
  - name: has_parking
    type: numeric(1,0)
    meaning: Whether parking is included
    examples:
    - 0
    - 1
  - name: rooms_en
    type: character varying(200)
    meaning: Bedroom layout in English (Studio, 1 B/R, 2 B/R, ...)
    examples:
    - Studio
    - 1 B/R
  - name: rooms_ar
    type: character varying(200)
