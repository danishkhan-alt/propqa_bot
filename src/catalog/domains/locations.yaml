id: locations
name: Communities, areas, and geo hierarchy
schema: chatbot_ai
description: Dubai communities, the location tree (public.locations_v2 and public.locations), Makani entrances,
  population, community editorial profiles (area_insights_communities and mv_community_landing_metrics),
  and catalogs of points of interest and roads. This is the usual join bridge for other domains.
synonyms:
- community
- area
- neighbourhood
- location
- subcommunity
- makani
- sector
- where is
grain: one row is a community, subcommunity, entrance, or area-insight profile
joins:
- domain: listings
  keys:
  - community_id
  - area_id
  - name_en
- domain: schools
  keys:
  - community_id
  - areaen
- domain: rta
  keys:
  - community_name
  - community_num
pitfalls:
- Community names are not always spelled the same across DLD vs Property Share vs RTA tables.
- area_insights_communities.location_id points at public.locations_v2, not chatbot_ai.
- Prefer ps_communities / dubai_community_areas for names; use dmgisnet_enterances for Makani coordinates.
- public.community_info is one JSON payload per master project and data_type. Filter data_type, then read data.
- public.locations type is building, project, or master_project. parent_id points at the parent location.
- Qualify public tables as public.<table>.
- 'Cue to table: where is X, which community is X in, or the hierarchy of a place -> public.locations_v2
  (title_en, parent_id) or public.locations (name_en, parent_id). Buildings in an area -> public.locations
  (type = ''building'') or locations_v2 (type = ''Building''). What a community is like, its schools,
  parks, healthcare, or who lives there -> chatbot_ai.area_insights_communities, with mv_community_landing_metrics
  for counts and nationalities. Which kinds of places or roads exist near an area -> public.nlp_search_pois,
  public.nlp_search_roads. A coordinate for a named landmark -> public.places. Resolving a typed place
  name -> public.nlp_search_locations.'
- 'area_insights_communities: never SELECT *; list the columns you need. description is always empty,
  so do not select it. Match title_en exact first (title_en = ''Business Bay''), then ILIKE only if nothing
  matches. schools, universities, nurseries, parks, healthcare, metro, restaurants and the other lists
  are JSON arrays; read them with jsonb_array_elements and LIMIT the result.'
- 'Community overview: join area_insights_communities to public.mv_community_landing_metrics by lower(title_en)
  = lower(community_name) (the name match finds every community that has insights; the key area_insights_id is mostly empty, so never join on it).
  Add the DLD yield and growth figures from public.mv_community_dld_market_metrics (market pack) by the
  same lower-case name match, and quote them only when their *_data_quality flag is ''ok''.'
- total_listings in mv_community_landing_metrics is what is on the market now. properties_sold and total_transactions_all_time
  are registered history. Never present one as the other.
- 'Never JOIN public.locations.area_id to real_estate_dld_areas.area_id: they are different id systems.
  To reach registered sales or rents for a place, filter the transactions pack tables on area_name_en
  or master_project_en, or on the DLD area name.'
- 'Names: JVC is ''Jumeirah Village Circle (JVC)'' in area_insights_communities and locations_v2, and
  master project ''Jumeirah Village Circle'' in public.locations and DLD. JVT is ''Jumeirah Village Triangle
  (JVT)''. JGE is ''Jumeirah Golf Estates''. MBR City is ''Mohammed Bin Rashid City''. BB is ''Business
  Bay''. Creek Harbour is ''Dubai Creek Harbour''. Prefer the stored value the grounding supplies.'
- 'False friends: Business Bay is not Marasi Business Bay (a separate neighbourhood). Dubai Marina is
  not Dubai Marina Mall (a building) or Dubai Marina Towers. Match the exact stored name before using
  ILIKE. DLD calls the Dubai Marina area Marsa Dubai.'
- 'Time: these tables are reference data. Use created_at or updated_at only when the user clearly asks
  when a row was added.'
- 'Not in this pack: sold prices and rents (transactions); community average prices, yields, and indices
  (market); live metro, tram, bus, parking, and Salik (rta); school fees and ratings (schools); asking-price
  listings (listings). ''What is Business Bay like'' loads this pack, and market only for its yield and
  growth figures; it never loads transactions.'
