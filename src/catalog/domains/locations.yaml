- name: locations
  description: Older location tree of master projects (about 235), projects, and buildings (about 15,700). parent_id is a self-join to the parent. Kept for the legacy listing columns (location_master_project_id, location_project_id, location_building_id). For communities and neighbourhoods prefer public.locations_v2.
  primary_key:
  - id
  columns:
  - name: id
    type: bigint
    meaning: Location identifier
  - name: type
    type: character varying(191)
    meaning: Level in the tree
    examples:
    - master_project
    - project
    - building
  - name: parent_id
    type: bigint
    meaning: Parent location. A building's parent is the project; a project's parent is the master project.
  - name: name_en
    type: character varying(191)
    meaning: Location name in English
  - name: name_ar
    type: character varying(191)
    meaning: Location name in Arabic
  - name: parent_name_en
    type: character varying(191)
    meaning: Parent name in English
  - name: lat
    type: numeric(10,8)
    meaning: Latitude
  - name: lng
    type: numeric(11,8)
    meaning: Longitude
  - name: area_id
    type: bigint
    meaning: DLD area identifier
  - name: aliases_en
    type: jsonb
    meaning: Other spellings as a JSON array of text; match with aliases_en::text ILIKE. Buildings carry their marketing name here.
  - name: slug_en
    type: character varying(191)
    meaning: English slug
  - name: is_free_zone
    type: boolean
    meaning: True when the location is a free zone
  qualified_name: public.locations
- name: locations_v2
  description: The current location tree and the shared place dimension for other packs. One row per emirate,
    neighbourhood (community), cluster or building. Match title_en (exact first, then ILIKE). parent_id
    is a self-join to the parent; level is the depth. public.properties.location_v2_id points here.
  primary_key:
  - id
  columns:
  - name: id
    type: bigint
    meaning: Location identifier; properties.location_v2_id and area_insights_communities.location_id
      reference it
  - name: type
    type: character varying(191)
    meaning: Level kind
    examples:
    - Neighbourhood
    - Building
    - Cluster
    - Emirate
  - name: title_en
    type: character varying(191)
    meaning: Name in English, for example Business Bay or Jumeirah Village Circle (JVC)
  - name: title_ar
    type: character varying(191)
    meaning: Name in Arabic
  - name: parent_id
    type: bigint
    meaning: Parent location in this table (self-join)
  - name: level
    type: smallint
    meaning: Depth in the tree; a lower number is broader
  - name: lat
    type: numeric
    meaning: Latitude
  - name: lng
    type: numeric
    meaning: Longitude
  - name: aliases_en
    type: jsonb
    meaning: Other spellings as a JSON array; match with aliases_en::text ILIKE
  - name: address_en
    type: text
    meaning: Address in English
  - name: slug_en
    type: character varying(255)
    meaning: English slug
  - name: city
    type: character varying(191)
    meaning: City
  - name: is_free_zone
    type: boolean
    meaning: True when the location is a free zone
  qualified_name: public.locations_v2
- name: nlp_search_locations
  description: Search index of place names with their parent ids, used to resolve a typed place to an
    area, master project, or project. One row per place (about 20,000). Use it only to resolve a name;
    for the tree use public.locations_v2 or public.locations.
  primary_key:
  - id
  columns:
  - name: id
    type: bigint
    meaning: Row identifier
  - name: type
    type: text
    meaning: Place kind
    examples:
    - building
    - project
    - area
    - master_project
    - sector
    - city
  - name: name_en
    type: text
    meaning: Name in English
  - name: slug_en
    type: text
    meaning: English slug
  - name: aliases
    type: text[]
    meaning: Other spellings
  - name: geo_resolved
    type: boolean
    meaning: True when the place has a geometry
  - name: area_id
    type: bigint[]
    meaning: Containing area ids
  - name: master_project_id
    type: bigint[]
    meaning: Containing master project ids
  - name: project_id
    type: bigint[]
    meaning: Containing project ids
  - name: sector_id
    type: bigint[]
    meaning: Containing sector ids
  - name: city_id
    type: bigint[]
    meaning: Containing city ids
  qualified_name: public.nlp_search_locations
- name: nlp_search_pois
  description: Catalog of points of interest (restaurants, parks, parking, supermarkets, bus stops, hotels,
    swimming pools and more; about 40,000), each with category, subcategory and containing area ids. Use
    it for what kinds of places exist in or near an area. It has no ratings or opening hours, and it is
    not the live RTA network.
  primary_key:
  - id
  columns:
  - name: id
    type: bigint
    meaning: Row identifier
  - name: name_en
    type: text
    meaning: Name in English
  - name: slug_en
    type: text
    meaning: English slug
  - name: aliases
    type: text[]
    meaning: Other spellings
  - name: category
    type: text
    meaning: Kind of place
    examples:
    - restaurant
    - parking
    - garden
    - swimming_pool
    - bus stop
    - supermarket
    - cafe
    - hotel
  - name: subcategory
    type: text
    meaning: Finer kind
  - name: area_id
    type: bigint[]
    meaning: Containing area ids
  - name: master_project_id
    type: bigint[]
    meaning: Containing master project ids
  - name: project_id
    type: bigint[]
    meaning: Containing project ids
  - name: source
    type: text
    meaning: Where the row came from
  qualified_name: public.nlp_search_pois
- name: nlp_search_roads
  description: Catalog of named roads (about 25,000) with road_type and containing area ids. Use it for
    which roads or highways serve an area. Major-road lengths and classes are in the rta pack.
  primary_key:
  - id
  columns:
  - name: id
    type: bigint
    meaning: Row identifier
  - name: name_en
    type: text
    meaning: Road name in English
  - name: slug_en
    type: text
    meaning: English slug
  - name: aliases
    type: text[]
    meaning: Other spellings
  - name: road_type
    type: text
    meaning: OpenStreetMap class
    examples:
    - residential
    - tertiary
    - secondary
    - primary
    - motorway
    - trunk
  - name: area_id
    type: bigint[]
    meaning: Containing area ids
  - name: master_project_id
    type: bigint[]
    meaning: Containing master project ids
  - name: project_id
    type: bigint[]
    meaning: Containing project ids
  qualified_name: public.nlp_search_roads
- name: places
  description: 'Named places with plain latitude and longitude: malls, bus stops, coffee shops, parks,
    cafes, restaurants, hospitals, metro stations (about 1,100 rows). Use it when only a coordinate for
    a named landmark is needed.'
  primary_key:
  - id
  columns:
  - name: id
    type: bigint
    meaning: Row identifier
  - name: name_en
    type: character varying(255)
    meaning: Name in English
  - name: name_ar
    type: character varying(255)
    meaning: Name in Arabic
  - name: latitude
    type: numeric(10,8)
    meaning: Latitude
  - name: longitude
    type: numeric(11,8)
    meaning: Longitude
  - name: type
    type: character varying(255)
    meaning: Kind of place
    examples:
    - malls
    - bus_stops
    - coffee_shops
    - parks
    - cafes
    - restaurants
    - hospitals
    - metro_stations
  qualified_name: public.places
- name: mv_community_landing_metrics
  description: 'Materialized view with one row per community (183): live listing count, properties sold,
    rental contracts signed, all-time transactions, and nationality mix. Join area_insights_communities
    by lower(title_en) = lower(community_name); area_insights_id is empty for most rows, so never join on it. total_listings is what is for
    sale or rent now; properties_sold and total_transactions_all_time are registered history; they are
    different figures.'
  primary_key: []
  columns:
  - name: community_name
    type: text
    meaning: Community name, spelled like area_insights_communities.title_en
  - name: total_listings
    type: bigint
    meaning: Listings on the market now
  - name: properties_sold
    type: bigint
    meaning: Registered sales in the community
  - name: rental_contracts_signed
    type: bigint
    meaning: Registered rent contracts
  - name: total_transactions_all_time
    type: bigint
    meaning: All registered transactions to date
  - name: top_nationality_name
    type: text
    meaning: Most common nationality among residents or buyers
  - name: top_nationality_pct
    type: numeric
    meaning: Share of the top nationality, percent
  - name: nationalities_sorted
    type: jsonb
    meaning: All nationalities with shares, largest first
  - name: area_insights_id
    type: bigint
    meaning: area_insights_communities.id; empty for about 60% of rows, so do not join on it
  - name: location_id
    type: bigint
    meaning: public.locations_v2 id
  - name: metrics_as_of_date
    type: date
    meaning: Date the figures were computed
  qualified_name: public.mv_community_landing_metrics
- name: bayut_locations
  description: EXTENDED. Bayut place names with a breadcrumb path (about 15,000). Use it only to reconcile
    a name spelled the Bayut way; for the tree use public.locations_v2.
  primary_key:
  - id
  columns:
  - name: id
    type: bigint
    meaning: Row identifier
  - name: title
    type: text
    meaning: Place name
  - name: type_en
    type: text
    meaning: Kind
    examples:
    - Building
    - Neighbourhood
    - Cluster
    - Emirate
  - name: breadcrumb_0
    type: text
    meaning: Top of the path (emirate or country)
  - name: breadcrumb_1
    type: text
    meaning: Second level
  - name: breadcrumb_2
    type: text
    meaning: Third level
  - name: breadcrumb_3
    type: text
    meaning: Fourth level
  - name: latitude
    type: double precision
    meaning: Latitude
  - name: longitude
    type: double precision
    meaning: Longitude
  qualified_name: public.bayut_locations
- name: countries
  description: EXTENDED. Countries (250 rows) with codes, region, phone code, and coordinates. Use for
    a country name or code lookup, for example a nationality's country.
  primary_key:
  - id
  columns:
  - name: id
    type: bigint
    meaning: Country identifier
  - name: common_name
    type: character varying(191)
    meaning: Common English name
  - name: official_name
    type: character varying(191)
    meaning: Official name
  - name: alpha_2_code
    type: character varying(2)
    meaning: ISO 3166 alpha-2 code
  - name: alpha_3_code
    type: character varying(3)
    meaning: ISO 3166 alpha-3 code
  - name: region
    type: character varying(191)
    meaning: Region
  - name: subregion
    type: character varying(191)
    meaning: Sub region
  - name: capital
    type: character varying(191)
    meaning: Capital city
  qualified_name: public.countries
- name: dld_community_lookup
  description: Alternate names for a community (area name and master project).
  primary_key:
  - community_name
  - lookup_field
  - lookup_value
  columns:
  - name: community_name
    type: text
    meaning: Canonical community name
  - name: lookup_field
    type: text
    meaning: Which name this alias is
    examples:
    - area_name_en
    - master_project_en
  - name: lookup_value
    type: text
    meaning: The alias to match in DLD tables
  qualified_name: public.dld_community_lookup

# Columns whose values are names users type. Grounding loads their stored spellings,
# so the SQL model filters on the exact value. same_place_as names a column on the same
# row that holds the official name of the same place; that pairing is learned from the data.
named_values:
- table: chatbot_ai.ps_communities
  column: community_name
  kind: community
- table: public.dld_community_lookup
  column: community_name
  kind: community
- table: chatbot_ai.dubai_community_areas
  column: name_en
  kind: area
- table: chatbot_ai.area_insights_communities
  column: title_en
  kind: community
