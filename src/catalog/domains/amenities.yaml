id: amenities
name: Parks, healthcare, and lifestyle
schema: chatbot_ai
description: Parks and beaches, hospitals/clinics, community things-to-do, and named building or project
  amenities (pool, gym). Use for lifestyle and facilities, not school or metro lookups.
synonyms:
- park
- beach
- hospital
- clinic
- amenities
- things to do
- healthcare
- pool
grain: one row is a park, health facility, or community activity
joins:
- domain: locations
  keys:
  - community_id
  - location
  - latitude
  - longitude
  - area_id
pitfalls:
- The amenity name list (public.amenities) and which listing has which amenity (amenity_property) are in the listings pack. Questions such as listings with a pool are listings questions.
- reelly_project_amenities links an off-plan project to amenity_name via reelly_project_id.
- Nearby parks, malls, and clinics per community are in public.community_info (locations), not in these tables.
- sheryan_health_facilities is DHA licensed facilities, not a distance-to-listing index.
- Qualify public tables as public.<table>.
- 'Not in this pack: listings that have a pool, gym or other amenity (listings: public.amenities and amenity_property);
  schools (schools); metro, bus and parking (rta); what an area is like overall (locations).'
tables:
- name: dubai_parks_and_beaches_coordinates
  description: Dubai parks and beaches X and Y coordinates
  primary_key:
  - park_name
  - park_name_ar
  - location
  - location_ar
  - coordinate_x
  - coordinate_y
  columns:
  - name: park_name
    type: character varying(100)
    meaning: Park name
    examples:
    - Creek Park
    - Al Safa Park
  - name: park_name_ar
    type: character varying(100)
    meaning: Park name in Arabic
  - name: location
    type: character varying(100)
    meaning: Location
    examples:
    - The ladies toilet 12
    - Toilet men 13
  - name: english_description
    type: character varying(300)
    meaning: English description
  - name: arabic_description
    type: character varying(300)
    meaning: Arabic description
  - name: coordinate_x
    type: character varying(20)
    meaning: Coordinate x
    examples:
    - DDD.dddddd
  - name: coordinate_y
    type: character varying(20)
    meaning: Coordinate y
    examples:
    - DD.dddddd
  - name: location_ar
    type: character varying(100)
    meaning: Location in Arabic
  qualified_name: chatbot_ai.dubai_parks_and_beaches_coordinates
