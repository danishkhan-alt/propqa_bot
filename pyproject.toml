[project]
name = "propqa-chatbot"
version = "0.1.0"
description = "Propqa AI real-estate agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "redis",
    "starlette",
    "langgraph>=1.2.11",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.0",
    "langfuse>=4.15",
    "langgraph-checkpoint-postgres>=3.0",
    "langgraph-checkpoint-redis>=0.5",
    "psycopg[binary,pool]>=3.2",
    "sqlglot>=26",
    "langchain-openai>=1.6.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/common/tests", "src/agent/tests", "src/routes/tests"]
